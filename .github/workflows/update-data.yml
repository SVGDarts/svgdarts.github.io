name: Google Sheets zu JSON Sync (Sofort-Update)

on:
  schedule:
    - cron: '0 */4 * * *' # Bleibt zur Sicherheit als Backup alle 4 Stunden
  workflow_dispatch:
  repository_dispatch:     # Erlaubt das Starten von außen via Webhook-Signal
    types: [trigger-sync]

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Pandas installieren
        run: pip install pandas

      - name: CSV in JSON umwandeln
        run: |
          python -c "
          import pandas as pd
          url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTHSHr_CUGwItHFYn0yX3cuH4E0cOGucdZmMk1NWJjP6SZCc0MBCj6ttvQymxistscQ249aiHza0HzN/pub?output=csv'
          df = pd.read_csv(url)
          df.to_json('data/daten.json', orient='records', force_ascii=False, indent=2)
          "

      - name: Änderungen committen und pushen
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sofort-Update: Google Sheet geändert"
          file_pattern: data/daten.json
